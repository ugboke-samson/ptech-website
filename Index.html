<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PTECH Electrical Ltd (RC 8550305) — Sauna & Steam Rooms, Electrical Engineering | Lagos</title>
  <link id="site-favicon" rel="icon" type="image/jpeg" href="logo.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --dark: #0a192f;
      --darker: #060f1d;
      --accent: #0056d2;
      --accent-hover: #0041a3;
      --light: #f8fafc;
      --white: #ffffff;
      --text: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { font-family: 'Lato', sans-serif; color: var(--text); line-height: 1.6; background: var(--white); }
    h1, h2, h3, .brand { font-family: 'Montserrat', sans-serif; text-transform: uppercase; letter-spacing: 1px; }
    a { text-decoration: none; color: inherit; }

    /* Top Utility Bar */
    .top-bar {
      background: var(--darker); color: #cbd5e1; font-size: 0.85rem;
      padding: 8px 5%; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .top-bar a:hover { color: #60a5fa; }

    /* Navigation */
    header {
      background: var(--dark); color: var(--white); padding: 14px 5%;
      display: flex; justify-content: space-between; align-items: center;
      position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 20px rgba(0,0,0,0.25);
    }
    .brand { display: flex; align-items: center; gap: 12px; font-size: 1.2rem; font-weight: 800; color: var(--white); }
    .brand img { height: 48px; width: 48px; border-radius: 50%; object-fit: cover; background: var(--white); border: 2px solid var(--accent); }
    .brand span { color: #3b82f6; }
    .brand small { display: block; font-size: 0.68rem; font-weight: 400; color: #94a3b8; letter-spacing: 1.5px; }
    nav { display: flex; gap: 22px; align-items: center; }
    nav a { font-size: 0.82rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; transition: color 0.2s; }
    nav a:hover { color: #60a5fa; }
    .nav-btn { background: var(--accent); padding: 9px 16px; border-radius: 3px; color: var(--white) !important; }
    .nav-btn:hover { background: var(--accent-hover); }

    /* Hero Banner */
    .hero {
      background: linear-gradient(rgba(6, 15, 29, 0.78), rgba(6, 15, 29, 0.86)),
                  url('https://images.unsplash.com/photo-1584622650111-993a426fbf0a?auto=format&fit=crop&w=1600&q=80') center/cover no-repeat
